{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Логин (3–32 символа, латиница/цифры) <input name="username" required></label>
  <label>Пароль (от 8 символов) <input name="password" type="password" required minlength="8"></label>
  <button>Зарегистрироваться</button>
</form>
{% endblock %}
